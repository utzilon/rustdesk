# Utzil Remote para iPhone y iPad: la librería de Rust, a mano (card uzKJFFe0).
#
# Opción B: aquí se compila la librería de iOS (aarch64-apple-ios) SIN FIRMAR y
# sin llaves, y se publica en la release pública ios-lib-<commit> de este repo.
# Xcode Cloud la baja en flutter/ios/ci_scripts/ci_post_clone.sh, compila Flutter
# y firma con la cuenta del equipo; ninguna llave de Apple pasa por GitHub.
#
# Los pasos son los de build-rustdesk-ios de flutter-build.yml (1.5.0), con la
# marca de utzil/marca.py, más una compilación de la app sin firmar como prueba
# antes de publicar: si la app no compila aquí, no se gasta la corrida de Apple.
# generate-bridge es copia del de utzil-remote.yml.
#
# Se corre sobre el MISMO commit que después se etiqueta para Xcode Cloud: la
# librería y el bridge tienen que ser de ese código.
name: Utzil Remote (librería de iOS)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  # Del bridge.yml de upstream (generate-bridge va aquí adentro).
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  generate-bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Default bridge for every platform still on Flutter 3.24.5 (generated with 3.22.3).
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
              flutter-version: "3.22.3",
              artifact-name: "bridge-artifact",
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
            # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
            # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-ios-lib:
    name: librería de iOS (aarch64-apple-ios)
    needs: [generate-bridge]
    runs-on: macos-15
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-ios-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # Servidor, llave, nombre y la sal del ID, igual que en las demás plataformas.
      - name: Marca (utzil/marca.py)
        run: python3 utzil/marca.py

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      # Prueba antes de publicar: la app completa, enlazada con la librería, sin
      # firmar. Con Xcode 26 si el runner lo trae, que es con el que Apple exige
      # subir a TestFlight y el que va a usar Xcode Cloud.
      - name: Compila la app de iOS sin firmar (prueba)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          cd flutter
          flutter build ios --release --no-codesign

      - name: Empaqueta la librería y el bridge
        run: |
          tar -czf utzil-remote-ios-lib.tar.gz \
            target/aarch64-apple-ios/release/liblibrustdesk.a \
            src/bridge_generated.rs src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart flutter/lib/generated_bridge.freezed.dart \
            flutter/ios/Runner/bridge_generated.h
          shasum -a 256 utzil-remote-ios-lib.tar.gz | tee utzil-remote-ios-lib.tar.gz.sha256
          ls -la utzil-remote-ios-lib.tar.gz

      - name: Sube la librería
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utzil-remote-ios-lib
          path: |
            utzil-remote-ios-lib.tar.gz
            utzil-remote-ios-lib.tar.gz.sha256

  # Único job que escribe en el repo: crea la release ios-lib-<commit> con la
  # librería. Si ya existía (otra corrida del mismo commit), la reemplaza.
  publicar-ios-lib:
    name: publica la librería de iOS
    needs: [build-ios-lib]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Baja la librería
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utzil-remote-ios-lib
          path: ./

      - name: Release ios-lib-<commit>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-lib-${GITHUB_SHA}"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Librería de iOS de Utzil Remote (${GITHUB_SHA::7})" \
            --notes "Librería de Rust de Utzil Remote para iOS (aarch64-apple-ios), sin firmar, y los archivos del bridge de Flutter del commit ${GITHUB_SHA}. La baja Xcode Cloud (flutter/ios/ci_scripts/ci_post_clone.sh)." \
            utzil-remote-ios-lib.tar.gz utzil-remote-ios-lib.tar.gz.sha256
